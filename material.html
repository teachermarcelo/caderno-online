<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Material — Caderno Online</title>
  <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg: 0 0% 100%; --fg: 222.2 84% 4.9%; }
    .dark { --bg: 222.2 84% 4.9%; --fg: 210 40% 98%; }
    body { background: hsl(var(--bg)); color: hsl(var(--fg)); font-family: system-ui, sans-serif; }
    .modal { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.open { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300">
  <header class="sticky top-0 z-50 border-b bg-white/80 dark:bg-gray-900/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center"><i data-lucide="book-open" class="h-5 w-5 text-white"></i></div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Caderno Online</h1>
      </a>
      <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition"><i data-lucide="sun" class="hidden dark:block h-5 w-5"></i><i data-lucide="moon" class="block dark:hidden h-5 w-5"></i></button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <div><h2 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="link-2" class="h-6 w-6 text-amber-500"></i> Biblioteca de Material</h2><p class="text-sm text-gray-500 mt-1">Links, vídeos e PDFs organizados</p></div>
      <button onclick="openModal()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium transition flex items-center gap-2"><i data-lucide="plus" class="h-4 w-4"></i> Novo Material</button>
    </div>
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="empty" class="hidden flex-col items-center justify-center py-16 text-center"><div class="h-16 w-16 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-4"><i data-lucide="file-plus-2" class="h-8 w-8 text-gray-400"></i></div><h3 class="text-lg font-semibold mb-2">Nenhum material encontrado</h3><p class="text-gray-500 max-w-sm">Adicione links ou recursos.</p></div>
  </main>

  <footer class="mt-auto border-t py-4 text-center text-xs text-gray-500">© <span id="year"></span> Caderno Online</footer>

  <!-- MODAL -->
  <div id="modal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-xl border w-full max-w-lg p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4"><h3 id="m-title" class="text-lg font-semibold">Novo Material</h3><button onclick="closeModal()" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full"><i data-lucide="x" class="h-5 w-5"></i></button></div>
      <form id="form" class="space-y-4">
        <input type="hidden" id="id">
        <div><label class="block text-sm font-medium mb-1">Título *</label><input type="text" id="titulo" required class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50"></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-medium mb-1">Tipo</label><select id="tipo" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600"><option value="link">Link</option><option value="video">Vídeo</option><option value="pdf">PDF</option><option value="audio">Áudio</option></select></div>
          <div><label class="block text-sm font-medium mb-1">Nível/Pasta</label><select id="nivel" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600"><option value="Global">Global</option><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option></select></div>
        </div>
        <div><label class="block text-sm font-medium mb-1">URL</label><input type="url" id="url" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50" placeholder="https://..."></div>
        <div><label class="block text-sm font-medium mb-1">Vincular a Aluno (opcional)</label><select id="aluno" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600"><option value="">Global (sem aluno)</option></select></div>
        <div><label class="block text-sm font-medium mb-1">Descrição</label><textarea id="descricao" rows="2" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50"></textarea></div>
        <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">Cancelar</button><button type="submit" class="flex-1 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium transition">Salvar</button></div>
      </form>
    </div>
  </div>

  <script>
    const html = document.documentElement;
    if(localStorage.getItem('theme')==='dark') html.classList.add('dark');
    document.getElementById('themeToggle').onclick = () => { html.classList.toggle('dark'); localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light'); };
    document.getElementById('year').textContent = new Date().getFullYear();

    function loadDB() { const s = localStorage.getItem('cadernoOnlineDB'); return s ? JSON.parse(s) : {alunos:[],turmas:[],cefr:[],material:[],agenda:[],financeiro:{transacoes:[]}}; }
    function saveDB(db) { localStorage.setItem('cadernoOnlineDB', JSON.stringify(db)); render(); }

    function render() {
      const db = loadDB();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      if(db.material.length===0) { list.innerHTML=''; empty.classList.remove('hidden'); empty.classList.add('flex'); return; }
      empty.classList.add('hidden'); empty.classList.remove('flex');
      
      list.innerHTML = db.material.map((m,i) => {
        const icon = m.tipo==='video' ? 'youtube' : m.tipo==='pdf' ? 'file-text' : m.tipo==='audio' ? 'music' : 'link';
        const color = m.tipo==='video' ? 'text-red-600 bg-red-50 dark:bg-red-900/20 dark:text-red-400' : m.tipo==='pdf' ? 'text-orange-600 bg-orange-50 dark:bg-orange-900/20 dark:text-orange-400' : m.tipo==='audio' ? 'text-purple-600 bg-purple-50 dark:bg-purple-900/20 dark:text-purple-400' : 'text-blue-600 bg-blue-50 dark:bg-blue-900/20 dark:text-blue-400';
        const linkBtn = m.url ? `<a href="${m.url}" target="_blank" class="mt-3 inline-flex items-center gap-1.5 text-sm ${color.replace('bg-','text-').split(' ')[0]} hover:underline"><i data-lucide="external-link" class="h-3.5 w-3.5"></i> Abrir Recurso</a>` : '';
        return `<div class="bg-white dark:bg-gray-800 p-4 rounded-xl border shadow-sm hover:shadow-md transition relative group">
          <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition flex gap-1">
            <button onclick="edit(${i})" class="p-1.5 bg-gray-100 dark:bg-gray-700 rounded hover:bg-blue-100 dark:hover:bg-blue-900/30 text-blue-600"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
            <button onclick="del(${i})" class="p-1.5 bg-gray-100 dark:bg-gray-700 rounded hover:bg-red-100 dark:hover:bg-red-900/30 text-red-600"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
          </div>
          <div class="flex items-center gap-3 mb-2">
            <div class="h-10 w-10 rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center"><i data-lucide="${icon}" class="h-5 w-5 ${color.split(' ')[0]}"></i></div>
            <div><h4 class="font-semibold">${m.titulo}</h4><p class="text-xs text-gray-500">${m.tipo} • ${m.nivel}</p></div>
          </div>
          ${m.descricao ? `<p class="text-sm text-gray-500 line-clamp-2">${m.descricao}</p>` : ''}
          ${linkBtn}
        </div>`;
      }).join('');
      lucide.createIcons();
    }

    function openModal(id=null) {
      document.getElementById('modal').classList.add('open');
      document.getElementById('m-title').textContent = id ? 'Editar Material' : 'Novo Material';
      document.getElementById('form').reset();
      document.getElementById('id').value = id ?? '';
      const db = loadDB();
      document.getElementById('aluno').innerHTML = '<option value="">Global (sem aluno)</option>' + db.alunos.map(a => `<option value="${a.id}">${a.nome} (${a.nivel||'N/A'})</option>`).join('');
      if(id!==null) {
        const m = db.material[id];
        document.getElementById('titulo').value = m.titulo;
        document.getElementById('tipo').value = m.tipo;
        document.getElementById('nivel').value = m.nivel;
        document.getElementById('url').value = m.url||'';
        document.getElementById('aluno').value = m.alunoId||'';
        document.getElementById('descricao').value = m.descricao||'';
      }
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const db = loadDB();
      const id = document.getElementById('id').value;
      const data = {
        id: id || crypto.randomUUID(),
        titulo: document.getElementById('titulo').value.trim(),
        tipo: document.getElementById('tipo').value,
        nivel: document.getElementById('nivel').value,
        url: document.getElementById('url').value.trim(),
        alunoId: document.getElementById('aluno').value || null,
        descricao: document.getElementById('descricao').value.trim()
      };
      if(id) { const i = db.material.findIndex(m=>m.id===id); if(i!==-1) db.material[i] = data; }
      else db.material.push(data);
      saveDB(db);
      closeModal();
    });

    function edit(i) { openModal(i); }
    function del(i) { if(confirm('Excluir este material?')) { const db=loadDB(); db.material.splice(i,1); saveDB(db); } }
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
    document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

    render();
  </script>
</body>
</html>
