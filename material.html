<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Material — Caderno Online</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            border: 'hsl(var(--border))',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --background: 0 0% 100%; --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%; --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%;
      --border: 214.3 31.8% 91.4%;
    }
    .dark {
      --background: 222.2 84% 4.9%; --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%; --muted: 217.2 32.6% 17.5%; --muted-foreground: 215 20.2% 65.1%;
      --border: 217.2 32.6% 17.5%;
    }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .modal { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .material-card { transition: all 0.2s; }
    .material-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen transition-colors duration-300">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 border-b bg-background/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="h-9 w-9 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center hover:opacity-90 transition">
          <i data-lucide="book-open" class="h-5 w-5 text-white"></i>
        </a>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Caderno Online</h1>
      </div>
      <button id="themeToggle" class="inline-flex items-center justify-center size-9 rounded-full bg-muted hover:bg-accent transition focus:outline-none focus:ring-2 focus:ring-purple-500/50" aria-label="Alternar tema">
        <i data-lucide="sun" class="h-5 w-5 transition-all dark:rotate-90 dark:opacity-0"></i>
        <i data-lucide="moon" class="h-5 w-5 transition-all -rotate-90 opacity-0 dark:rotate-0 dark:opacity-100 absolute"></i>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-bold flex items-center gap-2">
          <i data-lucide="link-2" class="h-6 w-6 text-amber-500"></i>
          Biblioteca de Materiais
        </h2>
        <p class="text-muted-foreground text-sm mt-1">Links, vídeos, PDFs e recursos organizados</p>
      </div>
      <button onclick="openModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium transition focus:outline-none focus:ring-2 focus:ring-amber-500/50">
        <i data-lucide="plus" class="h-4 w-4"></i> Novo Material
      </button>
    </div>

    <!-- Filters -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
        <input type="text" id="searchInput" placeholder="Buscar material..." class="w-full pl-10 pr-4 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50">
      </div>
      <select id="folderFilter" class="px-4 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50">
        <option value="">Todas as pastas</option>
        <option value="Global">Global</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
        <option value="C2">C2</option>
      </select>
    </div>

    <!-- Materials List -->
    <div id="materialList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center">
      <div class="h-16 w-16 rounded-2xl bg-muted flex items-center justify-center mb-4">
        <i data-lucide="file-plus-2" class="h-8 w-8 text-muted-foreground"></i>
      </div>
      <h3 class="text-lg font-semibold mb-2">Nenhum material encontrado</h3>
      <p class="text-muted-foreground max-w-sm">Adicione links, vídeos ou documentos para começar.</p>
    </div>
  </main>

  <!-- MODAL -->
  <div id="materialModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-card rounded-xl border w-full max-w-lg p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-semibold">Novo Material</h3>
        <button onclick="closeModal()" class="p-1 hover:bg-muted rounded-full transition"><i data-lucide="x" class="h-5 w-5"></i></button>
      </div>
      <form id="materialForm" class="space-y-4">
        <input type="hidden" id="materialId">
        <div>
          <label class="block text-sm font-medium mb-1">Título *</label>
          <input type="text" id="titulo" required class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50" placeholder="Ex: Verbos Irregulares">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">Tipo</label>
            <select id="tipo" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50">
              <option value="link">Link</option>
              <option value="video">Vídeo</option>
              <option value="pdf">PDF</option>
              <option value="audio">Áudio</option>
              <option value="folder">Pasta</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Nível/Pasta</label>
            <select id="nivel" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50">
              <option value="Global">Global</option>
              <option value="A1">A1</option>
              <option value="A2">A2</option>
              <option value="B1">B1</option>
              <option value="B2">B2</option>
              <option value="C1">C1</option>
              <option value="C2">C2</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">URL</label>
          <input type="url" id="url" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50" placeholder="https://...">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Vincular a Aluno (opcional)</label>
          <select id="aluno" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50">
            <option value="">Global (sem aluno)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Descrição</label>
          <textarea id="descricao" rows="2" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-amber-500/50"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-muted transition">Cancelar</button>
          <button type="submit" class="flex-1 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-medium transition">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="mt-auto border-t bg-background/80 backdrop-blur-md py-4">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-muted-foreground">
      © <span id="year"></span> Caderno Online — Plataforma de Ensino de Idiomas
    </div>
  </footer>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

    // THEME
    const themeToggle = $('#themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) html.classList.add('dark');
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    // DATA
    const defaultData = { alunos: [], turmas: [], cefr: [], financeiro: {entradas:0,saidas:0}, agenda: [], materiais: [] };
    function loadData() {
      const stored = localStorage.getItem('cadernoOnlineData');
      return stored ? JSON.parse(stored) : defaultData;
    }
    function saveData(data) {
      localStorage.setItem('cadernoOnlineData', JSON.stringify(data));
      renderMaterials();
      updateStudentSelect();
    }

    // RENDER
    function renderMaterials() {
      const data = loadData();
      const search = $('#searchInput').value.toLowerCase().trim();
      const folder = $('#folderFilter').value;

      let filtered = data.materiais.filter(m => {
        const matchSearch = !search || m.titulo.toLowerCase().includes(search) || (m.descricao||'').toLowerCase().includes(search);
        const matchFolder = !folder || m.nivel === folder;
        return matchSearch && matchFolder;
      });

      const listEl = $('#materialList');
      const emptyEl = $('#emptyState');
      
      if (filtered.length === 0) { listEl.innerHTML = ''; emptyEl.classList.remove('hidden'); return; }
      emptyEl.classList.add('hidden');

      const typeIcons = { link: 'link', video: 'video', pdf: 'file-text', audio: 'music', folder: 'folder' };
      const typeColors = { link: 'text-blue-500', video: 'text-red-500', pdf: 'text-orange-500', audio: 'text-purple-500', folder: 'text-amber-500' };

      listEl.innerHTML = filtered.map(m => {
        const aluno = data.alunos.find(a => a.id === m.alunoId);
        return `
        <div class="material-card bg-card rounded-xl border p-4 flex flex-col gap-3">
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
              <div class="h-10 w-10 rounded-lg bg-muted flex items-center justify-center">
                <i data-lucide="${typeIcons[m.tipo] || 'file'}" class="h-5 w-5 ${typeColors[m.tipo] || 'text-muted-foreground'}"></i>
              </div>
              <div>
                <h4 class="font-semibold">${m.titulo}</h4>
                <p class="text-xs text-muted-foreground capitalize">${m.tipo} • ${m.nivel}</p>
                ${aluno ? `<p class="text-xs text-muted-foreground mt-1">👤 ${aluno.nome}</p>` : ''}
              </div>
            </div>
            <div class="flex gap-1">
              <button onclick="editMaterial('${m.id}')" class="p-1.5 hover:bg-muted rounded transition" title="Editar"><i data-lucide="pencil" class="h-4 w-4"></i></button>
              <button onclick="deleteMaterial('${m.id}')" class="p-1.5 hover:bg-red-100 dark:hover:bg-red-900/30 text-red-500 rounded transition" title="Excluir"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
            </div>
          </div>
          ${m.descricao ? `<p class="text-sm text-muted-foreground line-clamp-2">${m.descricao}</p>` : ''}
          ${m.url ? `<a href="${m.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-sm text-amber-600 hover:text-amber-700 hover:underline"><i data-lucide="external-link" class="h-3.5 w-3.5"></i> Abrir Recurso</a>` : ''}
        </div>`;
      }).join('');
      lucide.createIcons();
    }

    function updateStudentSelect() {
      const data = loadData();
      const select = $('#aluno');
      const currentVal = select.value;
      select.innerHTML = '<option value="">Global (sem aluno)</option>' + data.alunos.map(a => `<option value="${a.id}">${a.nome} (${a.nivel||'N/A'})</option>`).join('');
      select.value = currentVal;
    }

    // MODAL
    function openModal(id = null) {
      $('#materialModal').classList.add('open');
      $('#modalTitle').textContent = id ? 'Editar Material' : 'Novo Material';
      $('#materialId').value = id || '';
      $('#materialForm').reset();
      updateStudentSelect();
      if (id) {
        const data = loadData();
        const m = data.materiais.find(x => x.id === id);
        if (m) {
          $('#titulo').value = m.titulo;
          $('#tipo').value = m.tipo || 'link';
          $('#nivel').value = m.nivel || 'Global';
          $('#url').value = m.url || '';
          $('#aluno').value = m.alunoId || '';
          $('#descricao').value = m.descricao || '';
        }
      }
    }

    function closeModal() { $('#materialModal').classList.remove('open'); }

    $('#materialForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      const id = $('#materialId').value;
      const materialData = {
        id: id || generateId(),
        titulo: $('#titulo').value.trim(),
        tipo: $('#tipo').value,
        nivel: $('#nivel').value,
        url: $('#url').value.trim(),
        alunoId: $('#aluno').value || null,
        descricao: $('#descricao').value.trim(),
        atualizadoEm: new Date().toISOString()
      };

      if (id) {
        const idx = data.materiais.findIndex(x => x.id === id);
        if (idx !== -1) data.materiais[idx] = { ...data.materiais[idx], ...materialData };
      } else {
        materialData.criadoEm = new Date().toISOString();
        data.materiais.push(materialData);
      }

      saveData(data);
      closeModal();
    });

    function editMaterial(id) { openModal(id); }
    function deleteMaterial(id) {
      if (!confirm('Tem certeza que deseja excluir este material?')) return;
      const data = loadData();
      data.materiais = data.materiais.filter(m => m.id !== id);
      saveData(data);
    }

    // EVENTS
    $('#searchInput').addEventListener('input', renderMaterials);
    $('#folderFilter').addEventListener('change', renderMaterials);
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
    $('#materialModal').addEventListener('click', (e) => { if(e.target === $('#materialModal')) closeModal(); });

    // INIT
    document.addEventListener('DOMContentLoaded', () => {
      $('#year').textContent = new Date().getFullYear();
      lucide.createIcons();
      renderMaterials();
    });
  </script>
</body>
</html>
