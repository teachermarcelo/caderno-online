<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Caderno Online</title>
    <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25'/></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#8b5cf6', secondary: '#ec4899' }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .dark body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .glass-effect { background: rgba(15, 23, 42, 0.95); }
        .modal { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal.open { opacity: 1; pointer-events: auto; }
        .floating-btn { position: fixed; bottom: 30px; right: 30px; z-index: 1000; transition: all 0.3s ease; }
        .floating-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 transition-colors duration-300">

    <!-- Header -->
    <header class="glass-effect sticky top-0 z-50 border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg hover:opacity-90 transition">
                        <i data-lucide="arrow-left" class="w-6 h-6 text-white"></i>
                    </a>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-primary to-pink-500 bg-clip-text text-transparent">Agenda</h1>
                </div>
                <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-300 shadow-md">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-yellow-400"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden text-gray-600"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search & Filter -->
        <div class="glass-effect rounded-2xl p-4 mb-6 shadow-lg flex flex-col sm:flex-row gap-3 items-center">
            <div class="relative flex-1 w-full">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar aula..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <select id="statusFilter" class="w-full sm:w-40 px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary">
                <option value="">Todos os Status</option>
                <option value="agendada">Agendada</option>
                <option value="concluida">Concluída</option>
                <option value="cancelada">Cancelada</option>
            </select>
        </div>

        <!-- List -->
        <div id="classList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injected via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center glass-effect rounded-2xl shadow-lg">
            <div class="w-16 h-16 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-4">
                <i data-lucide="calendar-off" class="w-8 h-8 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-600 dark:text-gray-300 mb-2">Nenhuma aula encontrada</h3>
            <p class="text-gray-500 max-w-sm">Agende sua primeira aula clicando no botão flutuante.</p>
        </div>
    </main>

    <!-- Floating Button -->
    <button onclick="openModal()" class="floating-btn w-14 h-14 rounded-full bg-gradient-to-r from-primary to-pink-500 text-white shadow-xl flex items-center justify-center" title="Nova Aula">
        <i data-lucide="plus" class="w-8 h-8"></i>
    </button>

    <!-- Footer -->
    <footer class="mt-auto border-t border-gray-200 dark:border-gray-700 py-6 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            &copy; <span id="year"></span> Caderno Online — Plataforma de Ensino de Idiomas
        </div>
    </footer>

    <!-- Modal -->
    <div id="classModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="glass-effect rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold mb-4 text-gray-800 dark:text-white">Nova Aula</h3>
            
            <form id="classForm" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Título *</label>
                    <input type="text" id="titulo" required class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Data *</label>
                        <input type="date" id="data" required class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Horário *</label>
                        <input type="time" id="horario" required class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                    <select id="status" class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="agendada">Agendada</option>
                        <option value="concluida">Concluída</option>
                        <option value="cancelada">Cancelada</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">Cancelar</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded-lg font-medium transition">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Database Logic
        const DB_KEY = 'cadernoOnlineDB';
        function getDB() {
            const data = localStorage.getItem(DB_KEY);
            return data ? JSON.parse(data) : { alunos: [], turmas: [], cefr: [], material: [], agenda: [], financeiro: { transacoes: [] } };
        }
        function saveDB(data) {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
            renderClasses();
        }

        // Theme Toggle
        const html = document.documentElement;
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });
        document.getElementById('year').textContent = new Date().getFullYear();

        // Render
        function renderClasses() {
            const db = getDB();
            const list = document.getElementById('classList');
            const empty = document.getElementById('emptyState');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = db.agenda.filter(c => {
                const matchSearch = c.titulo.toLowerCase().includes(search);
                const matchStatus = statusFilter ? c.status === statusFilter : true;
                return matchSearch && matchStatus;
            });

            // Sort by date/time
            filtered.sort((a, b) => {
                const dateA = new Date(a.data + 'T' + a.horario);
                const dateB = new Date(b.data + 'T' + b.horario);
                return dateA - dateB;
            });

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                empty.classList.add('flex');
                return;
            }
            empty.classList.add('hidden');
            empty.classList.remove('flex');

            const statusColors = {
                agendada: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400',
                concluida: 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400',
                cancelada: 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'
            };

            list.innerHTML = filtered.map((c, idx) => {
                const realIndex = db.agenda.indexOf(c);
                const dateObj = new Date(c.data + 'T12:00:00');
                const weekDay = dateObj.toLocaleDateString('pt-BR', { weekday: 'short' });

                return `
                <div class="glass-effect rounded-xl p-5 shadow-sm hover:shadow-md transition relative group">
                    <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition flex gap-1">
                        <button onclick="editClass(${realIndex})" class="p-1.5 bg-gray-100 dark:bg-gray-700 rounded hover:bg-blue-100 dark:hover:bg-blue-900/30 text-blue-600 transition">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteClass(${realIndex})" class="p-1.5 bg-gray-100 dark:bg-gray-700 rounded hover:bg-red-100 dark:hover:bg-red-900/30 text-red-600 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-lg bg-primary/10 flex flex-col items-center justify-center text-primary shrink-0">
                            <span class="text-xs font-bold uppercase">${weekDay.substring(0,3)}</span>
                            <span class="text-lg font-bold leading-none">${dateObj.getDate()}</span>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-800 dark:text-white text-lg">${c.titulo}</h4>
                            <div class="flex items-center gap-3 mt-1 text-sm text-gray-500 dark:text-gray-400">
                                <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${c.horario}</span>
                                <span class="px-2 py-0.5 rounded-full text-xs font-medium ${statusColors[c.status]}">${c.status}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        // Modal Logic
        function openModal(id = null) {
            document.getElementById('classModal').classList.add('open');
            document.getElementById('modalTitle').textContent = id ? 'Editar Aula' : 'Nova Aula';
            document.getElementById('classForm').reset();
            document.getElementById('editId').value = id ?? '';
            
            if (id !== null) {
                const db = getDB();
                const c = db.agenda[id];
                if (c) {
                    document.getElementById('titulo').value = c.titulo;
                    document.getElementById('data').value = c.data;
                    document.getElementById('horario').value = c.horario;
                    document.getElementById('status').value = c.status;
                }
            } else {
                document.getElementById('data').value = new Date().toISOString().split('T')[0];
            }
        }

        function closeModal() {
            document.getElementById('classModal').classList.remove('open');
        }

        // Form Submit
        document.getElementById('classForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const db = getDB();
            const id = document.getElementById('editId').value;
            const aulaData = {
                titulo: document.getElementById('titulo').value.trim(),
                data: document.getElementById('data').value,
                horario: document.getElementById('horario').value,
                status: document.getElementById('status').value
            };

            if (id !== '') {
                db.agenda[id] = { ...db.agenda[id], ...aulaData };
            } else {
                db.agenda.push(aulaData);
            }
            saveDB(db);
            closeModal();
        });

        // Actions
        function editClass(index) { openModal(index); }
        function deleteClass(index) {
            if (confirm('Excluir esta aula?')) {
                const db = getDB();
                db.agenda.splice(index, 1);
                saveDB(db);
            }
        }

        // Listeners
        document.getElementById('searchInput').addEventListener('input', renderClasses);
        document.getElementById('statusFilter').addEventListener('change', renderClasses);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        document.getElementById('classModal').addEventListener('click', e => { if (e.target.id === 'classModal') closeModal(); });

        // Init
        renderClasses();
        lucide.createIcons();
    </script>
</body>
</html>
