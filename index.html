<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno Online - Painel</title>
    <!-- Ícone -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    
    <!-- Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6', // Roxo
                        secondary: '#ec4899', // Rosa
                        background: '#ffffff',
                        surface: '#f8fafc',
                        text: '#0f172a',
                        darkBackground: '#0f172a',
                        darkSurface: '#1e293b',
                        darkText: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        /* Transições suaves para tema */
        body { transition: background-color 0.3s, color 0.3s; }
        .dark body { background-color: #0f172a; color: #f8fafc; }
        .dark .bg-surface { background-color: #1e293b; }
        .dark .text-text { color: #f8fafc; }
        .dark .border-gray-200 { border-color: #334155; }
    </style>
</head>
<body class="bg-surface text-text font-sans min-h-screen flex flex-col">

    <!-- CABEÇALHO -->
    <header class="bg-white dark:bg-darkSurface border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo e Título -->
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-primary to-secondary p-2 rounded-lg text-white">
                        <i data-lucide="book-open" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                        Caderno Online
                    </h1>
                </div>

                <!-- Botão Tema -->
                <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Saudação -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold">Visão Geral</h2>
            <p class="text-gray-500 dark:text-gray-400">Bem-vindo de volta ao seu sistema de ensino.</p>
        </div>

        <!-- CARDS DE ESTATÍSTICAS -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            
            <!-- Card Alunos -->
            <div class="bg-white dark:bg-darkSurface p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Alunos</p>
                        <h3 class="text-3xl font-bold mt-2" id="countAlunos">0</h3>
                    </div>
                    <div class="p-3 bg-blue-100 dark:bg-blue-900/30 rounded-lg text-blue-600 dark:text-blue-400">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                </div>
                <a href="alunos.html" class="mt-4 text-sm text-primary hover:underline flex items-center gap-1">
                    Ver alunos <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </a>
            </div>

            <!-- Card Turmas -->
            <div class="bg-white dark:bg-darkSurface p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Turmas Ativas</p>
                        <h3 class="text-3xl font-bold mt-2" id="countTurmas">0</h3>
                    </div>
                    <div class="p-3 bg-green-100 dark:bg-green-900/30 rounded-lg text-green-600 dark:text-green-400">
                        <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                    </div>
                </div>
                <a href="turmas.html" class="mt-4 text-sm text-primary hover:underline flex items-center gap-1">
                    Ver turmas <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </a>
            </div>

            <!-- Card Financeiro -->
            <div class="bg-white dark:bg-darkSurface p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Saldo Atual</p>
                        <h3 class="text-3xl font-bold mt-2 text-green-600" id="saldoAtual">R$ 0</h3>
                    </div>
                    <div class="p-3 bg-purple-100 dark:bg-purple-900/30 rounded-lg text-purple-600 dark:text-purple-400">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </div>
                </div>
                <a href="financeiro.html" class="mt-4 text-sm text-primary hover:underline flex items-center gap-1">
                    Ver financeiro <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </a>
            </div>

            <!-- Card Aulas -->
            <div class="bg-white dark:bg-darkSurface p-6 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Aulas Agendadas</p>
                        <h3 class="text-3xl font-bold mt-2" id="countAulas">0</h3>
                    </div>
                    <div class="p-3 bg-orange-100 dark:bg-orange-900/30 rounded-lg text-orange-600 dark:text-orange-400">
                        <i data-lucide="calendar" class="w-6 h-6"></i>
                    </div>
                </div>
                <a href="agenda.html" class="mt-4 text-sm text-primary hover:underline flex items-center gap-1">
                    Ver agenda <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </a>
            </div>
        </div>

        <!-- MENU DE NAVEGAÇÃO RÁPIDA -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
            <a href="index.html" class="flex flex-col items-center justify-center p-4 bg-white dark:bg-darkSurface border border-gray-200 rounded-xl hover:border-primary transition group">
                <i data-lucide="layout-dashboard" class="w-6 h-6 text-primary mb-2 group-hover:scale-110 transition"></i>
                <span class="text-sm font-medium">Início</span>
            </a>
            <a href="alunos.html" class="flex flex-col items-center justify-center p-4 bg-white dark:bg-darkSurface border border-gray-200 rounded-xl hover:border-primary transition group">
                <i data-lucide="users" class="w-6 h-6 text-gray-400 mb-2 group-hover:scale-110 group-hover:text-primary transition"></i>
                <span class="text-sm font-medium">Alunos</span>
            </a>
            <a href="turmas.html" class="flex flex-col items-center justify-center p-4 bg-white dark:bg-darkSurface border border-gray-200 rounded-xl hover:border-primary transition group">
                <i data-lucide="graduation-cap" class="w-6 h-6 text-gray-400 mb-2 group-hover:scale-110 group-hover:text-primary transition"></i>
                <span class="text-sm font-medium">Turmas</span>
            </a>
            <a href="cefr.html" class="flex flex-col items-center justify-center p-4 bg-white dark:bg-darkSurface border border-gray-200 rounded-xl hover:border-primary transition group">
                <i data-lucide="book-marked" class="w-6 h-6 text-gray-400 mb-2 group-hover:scale-110 group-hover:text-primary transition"></i>
                <span class="text-sm font-medium">CEFR</span>
            </a>
            <a href="material.html" class="flex flex-col items-center justify-center p-4 bg-white dark:bg-darkSurface border border-gray-200 rounded-xl hover:border-primary transition group">
                <i data-lucide="link" class="w-6 h-6 text-gray-400 mb-2 group-hover:scale-110 group-hover:text-primary transition"></i>
                <span class="text-sm font-medium">Material</span>
            </a>
            <a href="financeiro.html" class="flex flex-col items-center justify-center p-4 bg-white dark:bg-darkSurface border border-gray-200 rounded-xl hover:border-primary transition group">
                <i data-lucide="banknote" class="w-6 h-6 text-gray-400 mb-2 group-hover:scale-110 group-hover:text-primary transition"></i>
                <span class="text-sm font-medium">Financeiro</span>
            </a>
        </div>

    </main>

    <!-- RODAPÉ -->
    <footer class="bg-white dark:bg-darkSurface border-t border-gray-200 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            &copy; 2024 Caderno Online. Feito para ensino de idiomas.
        </div>
    </footer>

    <!-- SCRIPT (LÓGICA) -->
    <script>
        // 1. Configuração do Tema (Claro/Escuro)
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // Verifica preferência salva
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        // 2. Sistema de Dados (LocalStorage)
        // Inicializa dados vazios se não existirem
        if (!localStorage.getItem('cadernoOnlineDB')) {
            const initialData = {
                alunos: [],
                turmas: [],
                financeiro: { entradas: 0, saidas: 0 },
                aulas: []
            };
            localStorage.setItem('cadernoOnlineDB', JSON.stringify(initialData));
        }

        // Carrega dados
        const db = JSON.parse(localStorage.getItem('cadernoOnlineDB'));

        // 3. Atualiza os números na tela
        document.getElementById('countAlunos').innerText = db.alunos.length;
        document.getElementById('countTurmas').innerText = db.turmas.length;
        document.getElementById('countAulas').innerText = db.aulas.length;
        
        // Formata moeda
        const saldo = db.financeiro.entradas - db.financeiro.saidas;
        document.getElementById('saldoAtual').innerText = saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // Inicializa os ícones
        lucide.createIcons();
    </script>
</body>
</html>
