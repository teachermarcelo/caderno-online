<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno Online - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link para os ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Navegação Superior -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-gradient-to-br from-purple-600 to-pink-600 p-2 rounded-lg">
                        <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                        Caderno Online
                    </h1>
                </div>
                <div class="flex gap-2">
                    <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="home" class="w-4 h-4"></i> Home</a>
                    <a href="alunos.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Alunos</a>
                    <a href="turmas.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="graduation-cap" class="w-4 h-4"></i> Turmas</a>
                    <a href="financeiro.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="wallet" class="w-4 h-4"></i> Financeiro</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal com Abas -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Botões das Abas -->
        <div class="bg-gray-100 p-1 rounded-xl flex gap-1 mb-6">
            <button onclick="openTab('resumo', this)" class="tab-btn bg-white text-purple-600 font-semibold flex-1 py-2 px-4 rounded-lg text-sm transition">📊 Resumo</button>
            <button onclick="openTab('alunos', this)" class="tab-btn text-gray-600 flex-1 py-2 px-4 rounded-lg text-sm transition">👥 Alunos</button>
            <button onclick="openTab('financeiro', this)" class="tab-btn text-gray-600 flex-1 py-2 px-4 rounded-lg text-sm transition">💰 Financeiro</button>
        </div>

        <!-- Conteúdo: Resumo -->
        <div id="resumo" class="tab-content active space-y-6">
            <!-- Cards de Estatísticas -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="p-3 bg-purple-100 rounded-lg"><i data-lucide="users" class="w-6 h-6 text-purple-600"></i></div>
                        <div><p class="text-sm text-gray-500">Alunos</p><p class="text-2xl font-bold" id="dash-alunos">0</p></div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="p-3 bg-blue-100 rounded-lg"><i data-lucide="graduation-cap" class="w-6 h-6 text-blue-600"></i></div>
                        <div><p class="text-sm text-gray-500">Turmas</p><p class="text-2xl font-bold" id="dash-turmas">0</p></div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="p-3 bg-green-100 rounded-lg"><i data-lucide="file-text" class="w-6 h-6 text-green-600"></i></div>
                        <div><p class="text-sm text-gray-500">Aulas CEFR</p><p class="text-2xl font-bold" id="dash-cefr">0</p></div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="p-3 bg-purple-100 rounded-lg"><i data-lucide="wallet" class="w-6 h-6 text-purple-600"></i></div>
                        <div><p class="text-sm text-gray-500">Saldo</p><p class="text-2xl font-bold text-purple-600" id="dash-saldo">R$ 0</p></div>
                    </div>
                </div>
            </div>

            <!-- Resumo Financeiro Rápido -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="wallet" class="w-5 h-5 text-purple-600"></i> Movimentações</h3>
                    <div class="space-y-2" id="lista-transacoes">
                        <!-- Preenchido pelo app.js -->
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-purple-600"></i> Últimos Alunos</h3>
                    <div class="space-y-2" id="lista-alunos-dashboard">
                        <!-- Preenchido pelo app.js -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Conteúdo: Aba Alunos -->
        <div id="alunos" class="tab-content space-y-6">
            <div class="bg-white rounded-xl border shadow-sm p-6">
                <h2 class="text-xl font-bold mb-4">Lista de Alunos</h2>
                <div id="dash-alunos-list" class="text-gray-500">Gerencie seus alunos na aba Alunos > Adicionar.</div>
            </div>
        </div>

        <!-- Conteúdo: Aba Financeiro -->
        <div id="financeiro" class="tab-content space-y-6">
            <div class="bg-white rounded-xl border shadow-sm p-6">
                <h2 class="text-xl font-bold mb-4">Visão Financeira</h2>
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                        <p class="text-sm text-green-700">Entradas</p>
                        <p class="text-2xl font-bold text-green-700" id="fin-entradas">R$ 0,00</p>
                    </div>
                    <div class="p-4 bg-red-50 rounded-lg border border-red-200">
                        <p class="text-sm text-red-700">Saídas</p>
                        <p class="text-2xl font-bold text-red-700" id="fin-saidas">R$ 0,00</p>
                    </div>
                    <div class="p-4 bg-purple-50 rounded-lg border border-purple-200">
                        <p class="text-sm text-purple-700">Saldo</p>
                        <p class="text-2xl font-bold text-purple-700" id="fin-saldo">R$ 0,00</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- AQUI ESTÁ A MÁGICA: Link para o arquivo JS separado -->
    <script src="app.js"></script>
</body>
</html>
