<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas - Caderno Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-gray-800">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="book-open" class="text-purple-600 w-6 h-6"></i>
                    <span class="font-bold text-xl">Caderno Online</span>
                </div>
                <div class="hidden md:flex space-x-1 bg-gray-100 p-1 rounded-lg">
                    <a href="index.html" class="px-4 py-2 rounded-md flex items-center gap-2 hover:bg-white hover:shadow-sm transition-all"><i data-lucide="layout-dashboard" class="w-4 h-4"></i> Home</a>
                    <a href="alunos.html" class="px-4 py-2 rounded-md flex items-center gap-2 hover:bg-white hover:shadow-sm transition-all"><i data-lucide="users" class="w-4 h-4"></i> Alunos</a>
                    <a href="turmas.html" class="px-4 py-2 rounded-md bg-white shadow-sm text-purple-600 font-medium flex items-center gap-2"><i data-lucide="graduation-cap" class="w-4 h-4"></i> Turmas</a>
                    <a href="cefr.html" class="px-4 py-2 rounded-md flex items-center gap-2 hover:bg-white hover:shadow-sm transition-all"><i data-lucide="file-text" class="w-4 h-4"></i> CEFR</a>
                    <a href="material.html" class="px-4 py-2 rounded-md flex items-center gap-2 hover:bg-white hover:shadow-sm transition-all"><i data-lucide="link" class="w-4 h-4"></i> Material</a>
                    <a href="agenda.html" class="px-4 py-2 rounded-md flex items-center gap-2 hover:bg-white hover:shadow-sm transition-all"><i data-lucide="calendar" class="w-4 h-4"></i> Agenda</a>
                    <a href="financeiro.html" class="px-4 py-2 rounded-md flex items-center gap-2 hover:bg-white hover:shadow-sm transition-all"><i data-lucide="wallet" class="w-4 h-4"></i> Financeiro</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Gestão de Turmas</h2>
            <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Nova Turma
            </button>
        </div>

        <!-- Lista de Turmas -->
        <div id="classList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards injetados via JS -->
        </div>
    </main>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 m-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold" id="modalTitle">Nova Turma</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="classForm" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome da Turma *</label>
                    <input type="text" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Ex: Inglês B1 - Manhã">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nível CEFR</label>
                        <select id="level" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                            <option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option>
                            <option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Horário</label>
                        <input type="text" id="schedule" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Ex: Seg/Qua 10h">
                    </div>
                </div>

                <!-- Área de Links -->
                <div class="border-t pt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Links da Turma (Sala, Playlist, etc)</label>
                    <div id="linksContainer" class="space-y-2 mb-2"></div>
                    <button type="button" onclick="addLinkInput()" class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Adicionar Link
                    </button>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Carrega dados do localStorage (compartilhado com index e alunos)
        let db = JSON.parse(localStorage.getItem('cadernoDB')) || { alunos: [], turmas: [], cefr: [], agenda: [], financeiro: { entradas: 0, saidas: 0 } };

        function save() {
            localStorage.setItem('cadernoDB', JSON.stringify(db));
            renderClasses();
        }

        function renderClasses() {
            const list = document.getElementById('classList');
            list.innerHTML = '';
            
            if(db.turmas.length === 0) {
                list.innerHTML = '<p class="col-span-3 text-center text-gray-500 py-10">Nenhuma turma cadastrada.</p>';
                return;
            }

            db.turmas.forEach((turma, index) => {
                let linksHtml = '';
                if(turma.links && turma.links.length > 0) {
                    linksHtml = '<div class="mt-4 pt-4 border-t border-gray-100 flex flex-wrap gap-2">';
                    turma.links.forEach(link => {
                        let icon = link.type === 'video' ? 'youtube' : (link.type === 'pdf' ? 'file-text' : 'link');
                        let color = link.type === 'video' ? 'text-red-500 bg-red-50' : (link.type === 'pdf' ? 'text-orange-500 bg-orange-50' : 'text-blue-500 bg-blue-50');
                        
                        linksHtml += `
                            <a href="${link.url}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium ${color} hover:opacity-80 transition">
                                <i data-lucide="${icon}" class="w-3 h-3"></i> ${link.label}
                            </a>
                        `;
                    });
                    linksHtml += '</div>';
                }

                const card = `
                    <div class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all relative group">
                        <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                            <button onclick="editClass(${index})" class="p-1.5 bg-gray-100 rounded-full hover:bg-blue-100 text-blue-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                            <button onclick="deleteClass(${index})" class="p-1.5 bg-gray-100 rounded-full hover:bg-red-100 text-red-600"><i data-lucide="trash" class="w-4 h-4"></i></button>
                        </div>
                        <div class="flex items-center gap-4 mb-4">
                            <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">
                                ${turma.name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">${turma.name}</h3>
                                <span class="text-xs font-medium px-2 py-0.5 rounded bg-gray-100 text-gray-600">${turma.level}</span>
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mb-2"><i data-lucide="clock" class="w-3 h-3 inline mr-1"></i> ${turma.schedule || 'Sem horário definido'}</p>
                        ${linksHtml}
                    </div>
                `;
                list.innerHTML += card;
            });
            lucide.createIcons();
        }

        // Funções do Modal e Links (Reutilizadas do alunos.html para consistência)
        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.getElementById('classForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('linksContainer').innerHTML = '';
            addLinkInput();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }

        function addLinkInput(url = '', label = '', type = 'link') {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <select class="link-type border rounded p-1.5 text-sm w-24 bg-gray-50">
                    <option value="link" ${type==='link'?'selected':''}>Link</option>
                    <option value="video" ${type==='video'?'selected':''}>Vídeo</option>
                    <option value="pdf" ${type==='pdf'?'selected':''}>PDF</option>
                </select>
                <input type="text" placeholder="URL" class="link-url border rounded p-1.5 text-sm flex-1" value="${url}">
                <input type="text" placeholder="Rótulo" class="link-label border rounded p-1.5 text-sm w-24" value="${label}">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:bg-red-50 p-1 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
            `;
            document.getElementById('linksContainer').appendChild(div);
            lucide.createIcons();
        }

        function getLinksFromForm() {
            const links = [];
            const rows = document.getElementById('linksContainer').children;
            for(let row of rows) {
                const url = row.querySelector('.link-url').value;
                if(url) {
                    links.push({
                        type: row.querySelector('.link-type').value,
                        url: url,
                        label: row.querySelector('.link-label').value || 'Acessar'
                    });
                }
            }
            return links;
        }

        document.getElementById('classForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const newClass = {
                name: document.getElementById('name').value,
                level: document.getElementById('level').value,
                schedule: document.getElementById('schedule').value,
                links: getLinksFromForm()
            };

            if(id !== '') {
                db.turmas[id] = newClass;
            } else {
                db.turmas.push(newClass);
            }
            save();
            closeModal();
        });

        function editClass(index) {
            const turma = db.turmas[index];
            document.getElementById('editId').value = index;
            document.getElementById('name').value = turma.name;
            document.getElementById('level').value = turma.level;
            document.getElementById('schedule').value = turma.schedule;
            
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            if(turma.links) {
                turma.links.forEach(l => addLinkInput(l.url, l.label, l.type));
            } else {
                addLinkInput();
            }
            
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function deleteClass(index) {
            if(confirm('Tem certeza?')) {
                db.turmas.splice(index, 1);
                save();
            }
        }

        renderClasses();
    </script>
</body>
</html>
