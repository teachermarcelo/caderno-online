<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turmas — Caderno Online</title>
  <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25'/></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            border: 'hsl(var(--border))',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --background: 0 0% 100%; --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%; --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%;
      --border: 214.3 31.8% 91.4%;
    }
    .dark {
      --background: 222.2 84% 4.9%; --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%; --muted: 217.2 32.6% 17.5%; --muted-foreground: 215 20.2% 65.1%;
      --border: 217.2 32.6% 17.5%;
    }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .modal { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .turma-card { transition: all 0.2s; }
    .turma-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen transition-colors duration-300">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 border-b bg-background/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="h-9 w-9 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center hover:opacity-90 transition">
          <i data-lucide="book-open" class="h-5 w-5 text-white"></i>
        </a>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Caderno Online</h1>
      </div>
      <button id="themeToggle" class="inline-flex items-center justify-center size-9 rounded-full bg-muted hover:bg-accent transition focus:outline-none focus:ring-2 focus:ring-purple-500/50" aria-label="Alternar tema">
        <i data-lucide="sun" class="h-5 w-5 transition-all dark:rotate-90 dark:opacity-0"></i>
        <i data-lucide="moon" class="h-5 w-5 transition-all -rotate-90 opacity-0 dark:rotate-0 dark:opacity-100 absolute"></i>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-bold flex items-center gap-2">
          <i data-lucide="graduation-cap" class="h-6 w-6 text-blue-500"></i>
          Gestão de Turmas
        </h2>
        <p class="text-muted-foreground text-sm mt-1">Organize horários, níveis e alunos por grupo</p>
      </div>
      <button onclick="openModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-500/50">
        <i data-lucide="plus" class="h-4 w-4"></i> Nova Turma
      </button>
    </div>

    <!-- Turma List -->
    <div id="turmaList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards serão injetados via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center">
      <div class="h-16 w-16 rounded-2xl bg-muted flex items-center justify-center mb-4">
        <i data-lucide="users" class="h-8 w-8 text-muted-foreground"></i>
      </div>
      <h3 class="text-lg font-semibold mb-2">Nenhuma turma encontrada</h3>
      <p class="text-muted-foreground max-w-sm">Crie sua primeira turma ou ajuste os filtros.</p>
    </div>
  </main>

  <!-- MODAL -->
  <div id="turmaModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-card rounded-xl border w-full max-w-lg p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-semibold">Nova Turma</h3>
        <button onclick="closeModal()" class="p-1 hover:bg-muted rounded-full transition"><i data-lucide="x" class="h-5 w-5"></i></button>
      </div>
      <form id="turmaForm" class="space-y-4">
        <input type="hidden" id="turmaId">
        <div>
          <label class="block text-sm font-medium mb-1">Nome *</label>
          <input type="text" id="nome" required class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-blue-500/50" placeholder="Ex: Inglês B1 Manhã">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Descrição</label>
          <textarea id="descricao" rows="2" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-blue-500/50"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">Horário</label>
            <input type="text" id="horario" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-blue-500/50" placeholder="Ex: Seg/Qua 14h-15h">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Nível CEFR</label>
            <select id="nivel" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-blue-500/50">
              <option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option>
              <option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Alunos Vinculados</label>
          <div id="alunosContainer" class="checkbox-grid p-3 border rounded-lg bg-muted/30 space-y-1 max-h-32 overflow-y-auto">
            <p class="text-sm text-muted-foreground text-center py-2">Nenhum aluno cadastrado ainda.</p>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Links & Recursos</label>
          <div id="linksContainer" class="space-y-2 mb-2"></div>
          <button type="button" onclick="addLinkInput()" class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> Adicionar Link/Recurso
          </button>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-muted transition">Cancelar</button>
          <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="mt-auto border-t bg-background/80 backdrop-blur-md py-4">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-muted-foreground">
      © <span id="year"></span> Caderno Online — Plataforma de Ensino de Idiomas
    </div>
  </footer>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

    // THEME
    const themeToggle = $('#themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) html.classList.add('dark');
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    // DATA
    const defaultData = { alunos: [], turmas: [], cefr: [], financeiro: {entradas:0,saidas:0}, agenda: [] };
    function loadData() {
      const stored = localStorage.getItem('cadernoOnlineDB');
      return stored ? JSON.parse(stored) : defaultData;
    }
    function saveData(data) {
      localStorage.setItem('cadernoOnlineDB', JSON.stringify(data));
      renderTurmas();
    }

    // RENDER
    function renderTurmas() {
      const data = loadData();
      const listEl = $('#turmaList');
      const emptyEl = $('#emptyState');
      
      if (data.turmas.length === 0) { listEl.innerHTML = ''; emptyEl.classList.remove('hidden'); return; }
      emptyEl.classList.add('hidden');

      listEl.innerHTML = data.turmas.map((t, index) => {
        const alunosNomes = (t.alunosIds || []).map(id => {
          const a = data.alunos.find(x => x.id === id);
          return a ? a.nome : null;
        }).filter(Boolean);

        let linksHtml = '';
        if(t.links && t.links.length > 0) {
          linksHtml = '<div class="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-2">';
          t.links.forEach(link => {
            let icon = link.type === 'video' ? 'youtube' : (link.type === 'pdf' ? 'file-text' : 'link');
            let color = link.type === 'video' ? 'text-red-500 bg-red-50' : (link.type === 'pdf' ? 'text-orange-500 bg-orange-50' : 'text-blue-500 bg-blue-50');
            linksHtml += `
              <a href="${link.url}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium ${color} hover:opacity-80 transition">
                <i data-lucide="${icon}" class="w-3 h-3"></i> ${link.label}
              </a>
            `;
          });
          linksHtml += '</div>';
        }

        return `
        <div class="turma-card bg-card rounded-xl border p-5 flex flex-col gap-3 relative group">
          <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
            <button onclick="editTurma(${index})" class="p-1.5 bg-gray-100 rounded-full hover:bg-blue-100 text-blue-600"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
            <button onclick="deleteTurma(${index})" class="p-1.5 bg-gray-100 rounded-full hover:bg-red-100 text-red-600"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
          </div>
          <div class="flex items-center gap-4 mb-2">
            <div class="h-10 w-10 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center text-white font-bold text-lg">
              ${t.nome.charAt(0).toUpperCase()}
            </div>
            <div>
              <h4 class="font-semibold text-lg">${t.nome}</h4>
              <span class="text-xs font-medium px-2 py-0.5 rounded bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400">${t.nivel}</span>
            </div>
          </div>
          ${t.descricao ? `<p class="text-sm text-muted-foreground line-clamp-2">${t.descricao}</p>` : ''}
          <div class="text-sm space-y-1.5 text-muted-foreground mt-1">
            ${t.horario ? `<p class="flex items-center gap-1.5"><i data-lucide="clock" class="h-3.5 w-3.5"></i> ${t.horario}</p>` : ''}
            <p class="flex items-center gap-1.5"><i data-lucide="users" class="h-3.5 w-3.5"></i> ${alunosNomes.length > 0 ? alunosNomes.join(', ') : 'Sem alunos vinculados'}</p>
          </div>
          ${linksHtml}
        </div>`;
      }).join('');
      lucide.createIcons();
    }

    // MODAL & FORM
    function openModal(id = null) {
      $('#turmaModal').classList.add('open');
      $('#modalTitle').textContent = id ? 'Editar Turma' : 'Nova Turma';
      $('#turmaId').value = id || '';
      $('#turmaForm').reset();
      renderAlunosCheckbox([]);
      $('#linksContainer').innerHTML = '';
      addLinkInput();
    }

    function closeModal() { $('#turmaModal').classList.remove('open'); }

    function renderAlunosCheckbox(selectedIds = []) {
      const data = loadData();
      const container = $('#alunosContainer');
      if (data.alunos.length === 0) {
        container.innerHTML = '<p class="text-sm text-muted-foreground text-center py-2">Nenhum aluno cadastrado ainda.</p>';
        return;
      }
      container.innerHTML = data.alunos.map(a => `
        <label class="flex items-center gap-2 p-2 rounded hover:bg-muted/50 cursor-pointer">
          <input type="checkbox" value="${a.id}" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" ${selectedIds.includes(a.id) ? 'checked' : ''}>
          <div>
            <p class="text-sm font-medium">${a.nome}</p>
            <p class="text-xs text-muted-foreground">${a.nivel || 'N/A'}</p>
          </div>
        </label>
      `).join('');
    }

    // LINKS
    function addLinkInput(url = '', label = '', type = 'link') {
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center';
      div.innerHTML = `
        <select class="link-type border rounded p-1.5 text-sm w-24 bg-gray-50">
          <option value="link" ${type==='link'?'selected':''}>Link</option>
          <option value="video" ${type==='video'?'selected':''}>Vídeo</option>
          <option value="pdf" ${type==='pdf'?'selected':''}>PDF</option>
        </select>
        <input type="text" placeholder="URL (https://...)" class="link-url border rounded p-1.5 text-sm flex-1" value="${url}">
        <input type="text" placeholder="Rótulo" class="link-label border rounded p-1.5 text-sm w-24" value="${label}">
        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:bg-red-50 p-1 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
      `;
      $('#linksContainer').appendChild(div);
      lucide.createIcons();
    }

    function getLinksFromForm() {
      const links = [];
      const rows = $('#linksContainer').children;
      for(let row of rows) {
        const url = row.querySelector('.link-url').value.trim();
        if(url) {
          links.push({
            type: row.querySelector('.link-type').value,
            url: url,
            label: row.querySelector('.link-label').value.trim() || 'Acessar'
          });
        }
      }
      return links;
    }

    $('#turmaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      const id = $('#turmaId').value;
      const selectedAlunos = Array.from($$('#alunosContainer input:checked')).map(cb => cb.value);

      const turmaData = {
        id: id || generateId(),
        nome: $('#nome').value.trim(),
        descricao: $('#descricao').value.trim(),
        horario: $('#horario').value.trim(),
        nivel: $('#nivel').value,
        alunosIds: selectedAlunos,
        links: getLinksFromForm()
      };

      if (id) {
        const idx = data.turmas.findIndex(x => x.id === id);
        if (idx !== -1) data.turmas[idx] = { ...data.turmas[idx], ...turmaData };
      } else {
        turmaData.criadoEm = new Date().toISOString();
        data.turmas.push(turmaData);
      }

      saveData(data);
      closeModal();
    });

    function editTurma(index) {
      const data = loadData();
      const t = data.turmas[index];
      openModal(index);
      $('#nome').value = t.nome;
      $('#descricao').value = t.descricao || '';
      $('#horario').value = t.horario || '';
      $('#nivel').value = t.nivel || 'A1';
      
      setTimeout(() => {
        renderAlunosCheckbox(t.alunosIds || []);
        $('#linksContainer').innerHTML = '';
        if (t.links?.length) t.links.forEach(l => addLinkInput(l.url, l.label, l.type));
        else addLinkInput();
      }, 50);
    }

    function deleteTurma(index) {
      if (!confirm('Tem certeza que deseja excluir esta turma?')) return;
      const data = loadData();
      data.turmas.splice(index, 1);
      saveData(data);
    }

    // EVENTS
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
    $('#turmaModal').addEventListener('click', (e) => { if(e.target === $('#turmaModal')) closeModal(); });

    // INIT
    document.addEventListener('DOMContentLoaded', () => {
      $('#year').textContent = new Date().getFullYear();
      lucide.createIcons();
      renderTurmas();
    });
  </script>
</body>
</html>
