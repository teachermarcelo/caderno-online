<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos - Caderno Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- IMPORTANTE: Importa o cérebro do sistema -->
    <script src="app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar Simplificada -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Voltar
            </a>
            <h1 class="text-lg font-semibold text-gray-600">Gestão de Alunos</h1>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header da Página -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Lista de Alunos</h2>
            <button onclick="abrirModal()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Novo Aluno
            </button>
        </div>

        <!-- Lista de Cards -->
        <div id="listaAlunos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards serão injetados aqui via JS -->
        </div>
        
        <div id="msgVazio" class="hidden text-center py-12 text-gray-500">
            <i data-lucide="users" class="w-12 h-12 mx-auto mb-3 text-gray-300"></i>
            <p>Nenhum aluno cadastrado ainda.</p>
        </div>
    </main>

    <!-- Modal de Cadastro -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-bold">Novo Aluno</h3>
                <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="formAluno" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome Completo *</label>
                    <input type="text" id="nome" required class="w-full mt-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nível CEFR</label>
                    <select id="nivel" class="w-full mt-1 px-3 py-2 border rounded-lg">
                        <option value="A1">A1 - Iniciante</option>
                        <option value="A2">A2 - Básico</option>
                        <option value="B1">B1 - Intermediário</option>
                        <option value="B2">B2 - Intermediário Alto</option>
                        <option value="C1">C1 - Avançado</option>
                        <option value="C2">C2 - Proficiente</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Telefone</label>
                    <input type="text" id="telefone" class="w-full mt-1 px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Links (Opcional)</label>
                    <div id="linksContainer" class="space-y-2 mt-1"></div>
                    <button type="button" onclick="adicionarLinkInput()" class="text-sm text-purple-600 mt-1 flex items-center gap-1">
                        <i data-lucide="plus-circle" class="w-3 h-3"></i> Adicionar Link
                    </button>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="fecharModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Renderiza a lista de alunos na tela
        function renderizarLista() {
            const db = getDB();
            const container = document.getElementById('listaAlunos');
            const msgVazio = document.getElementById('msgVazio');
            
            container.innerHTML = '';
            
            if (db.alunos.length === 0) {
                msgVazio.classList.remove('hidden');
            } else {
                msgVazio.classList.add('hidden');
                db.alunos.forEach(aluno => {
                    let linksHtml = '';
                    if (aluno.links && aluno.links.length > 0) {
                        linksHtml = `<div class="mt-3 pt-3 border-t flex flex-wrap gap-2">
                            ${aluno.links.map(l => `<a href="${l.url}" target="_blank" class="text-xs bg-gray-100 px-2 py-1 rounded hover:bg-purple-100 text-purple-700">${l.label || 'Link'}</a>`).join('')}
                        </div>`;
                    }

                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-xl border shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center font-bold">
                                        ${aluno.nome.charAt(0)}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-gray-800">${aluno.nome}</h3>
                                        <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600">${aluno.nivel}</span>
                                    </div>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="editarAluno('${aluno.id}')" class="p-1.5 text-gray-400 hover:text-blue-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                    <button onclick="removerAluno('${aluno.id}')" class="p-1.5 text-gray-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                            ${aluno.telefone ? `<p class="text-sm text-gray-500 mt-2"><i data-lucide="phone" class="w-3 h-3 inline mr-1"></i> ${aluno.telefone}</p>` : ''}
                            ${linksHtml}
                        </div>
                    `;
                });
            }
            lucide.createIcons();
        }

        // Funções do Modal
        function abrirModal(id = null) {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('formAluno').reset();
            document.getElementById('editId').value = '';
            document.getElementById('linksContainer').innerHTML = '';
            adicionarLinkInput();

            if (id) {
                const aluno = getDB().alunos.find(a => a.id === id);
                if (aluno) {
                    document.getElementById('editId').value = aluno.id;
                    document.getElementById('nome').value = aluno.nome;
                    document.getElementById('nivel').value = aluno.nivel;
                    document.getElementById('telefone').value = aluno.telefone || '';
                    if (aluno.links) {
                        aluno.links.forEach(l => adicionarLinkInput(l.url, l.label));
                    }
                }
            }
        }

        function fecharModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function adicionarLinkInput(url = '', label = '') {
            const div = document.createElement('div');
            div.className = 'flex gap-2';
            div.innerHTML = `
                <input type="text" placeholder="URL" value="${url}" class="link-url flex-1 text-sm px-2 py-1 border rounded">
                <input type="text" placeholder="Nome" value="${label}" class="link-label w-20 text-sm px-2 py-1 border rounded">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600">×</button>
            `;
            document.getElementById('linksContainer').appendChild(div);
        }

        function getLinks() {
            const links = [];
            document.querySelectorAll('#linksContainer > div').forEach(div => {
                const url = div.querySelector('.link-url').value;
                if (url) {
                    links.push({ url, label: div.querySelector('.link-label').value });
                }
            });
            return links;
        }

        // Eventos do Formulário
        document.getElementById('formAluno').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                nome: document.getElementById('nome').value,
                nivel: document.getElementById('nivel').value,
                telefone: document.getElementById('telefone').value,
                links: getLinks()
            };

            if (id) {
                updateAluno(id, data);
            } else {
                addAluno(data);
            }
            
            fecharModal();
            renderizarLista();
        });

        function editarAluno(id) { abrirModal(id); }
        function removerAluno(id) { deleteAluno(id); renderizarLista(); }

        // Inicializa a página
        renderizarLista();
    </script>
</body>
</html>
