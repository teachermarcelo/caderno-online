<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alunos — Caderno Online</title>
  
  <!-- Ícone -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25'/></svg>">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'muted': 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            border: 'hsl(var(--border))',
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --background: 0 0% 100%; --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%; --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%;
      --border: 214.3 31.8% 91.4%;
    }
    .dark {
      --background: 222.2 84% 4.9%; --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%; --muted: 217.2 32.6% 17.5%; --muted-foreground: 215 20.2% 65.1%;
      --border: 217.2 32.6% 17.5%;
    }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .modal { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .student-card { transition: all 0.2s; }
    .student-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.08); }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen transition-colors duration-300">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 border-b bg-background/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="h-9 w-9 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center hover:opacity-90 transition">
          <i data-lucide="book-open" class="h-5 w-5 text-white"></i>
        </a>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">
          Caderno Online
        </h1>
      </div>
      <button id="themeToggle" class="inline-flex items-center justify-center size-9 rounded-full bg-muted hover:bg-accent transition focus:outline-none focus:ring-2 focus:ring-purple-500/50" aria-label="Alternar tema">
        <i data-lucide="sun" class="h-5 w-5 transition-all dark:rotate-90 dark:opacity-0"></i>
        <i data-lucide="moon" class="h-5 w-5 transition-all -rotate-90 opacity-0 dark:rotate-0 dark:opacity-100 absolute"></i>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-6">
    
    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-bold flex items-center gap-2">
          <i data-lucide="users" class="h-6 w-6 text-purple-500"></i>
          Gestão de Alunos
        </h2>
        <p class="text-muted-foreground text-sm mt-1">Cadastre, edite e acompanhe o progresso dos seus alunos</p>
      </div>
      <button onclick="openModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition focus:outline-none focus:ring-2 focus:ring-purple-500/50">
        <i data-lucide="plus" class="h-4 w-4"></i>
        Novo Aluno
      </button>
    </div>

    <!-- Filters -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground"></i>
        <input type="text" id="searchInput" placeholder="Buscar por nome ou e-mail..." 
               class="w-full pl-10 pr-4 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
      </div>
      <select id="levelFilter" class="px-4 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
        <option value="">Todos os níveis</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
        <option value="C2">C2</option>
      </select>
    </div>

    <!-- Student List -->
    <div id="studentList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Cards serão injetados via JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center">
      <div class="h-16 w-16 rounded-2xl bg-muted flex items-center justify-center mb-4">
        <i data-lucide="user-plus" class="h-8 w-8 text-muted-foreground"></i>
      </div>
      <h3 class="text-lg font-semibold mb-2">Nenhum aluno encontrado</h3>
      <p class="text-muted-foreground max-w-sm">Cadastre seu primeiro aluno ou ajuste os filtros de busca.</p>
    </div>

  </main>

  <!-- MODAL -->
  <div id="studentModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-card rounded-xl border w-full max-w-md p-6 shadow-xl animate-fade-in">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="text-lg font-semibold">Novo Aluno</h3>
        <button onclick="closeModal()" class="p-1 hover:bg-muted rounded-full transition">
          <i data-lucide="x" class="h-5 w-5"></i>
        </button>
      </div>
      <form id="studentForm" class="space-y-4">
        <input type="hidden" id="studentId">
        <div>
          <label class="block text-sm font-medium mb-1">Nome completo *</label>
          <input type="text" id="nome" required class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">E-mail</label>
            <input type="email" id="email" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Telefone</label>
            <input type="tel" id="telefone" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium mb-1">Nível CEFR</label>
            <select id="nivel" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
              <option value="">Selecionar</option>
              <option value="A1">A1</option><option value="A2">A2</option>
              <option value="B1">B1</option><option value="B2">B2</option>
              <option value="C1">C1</option><option value="C2">C2</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Data de início</label>
            <input type="date" id="dataInicio" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Observações</label>
          <textarea id="observacoes" rows="2" class="w-full px-3 py-2 rounded-lg border bg-card focus:outline-none focus:ring-2 focus:ring-purple-500/50"></textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-muted transition">Cancelar</button>
          <button type="submit" class="flex-1 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="mt-auto border-t bg-background/80 backdrop-blur-md py-4">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-muted-foreground">
      © <span id="year"></span> Caderno Online — Plataforma de Ensino de Idiomas
    </div>
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    // ====== UTILS ======
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
    const formatDate = (dateStr) => dateStr ? new Date(dateStr).toLocaleDateString('pt-BR') : '-';

    // ====== THEME ======
    const themeToggle = $('#themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }
    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });

    // ====== DATA MANAGEMENT ======
    const defaultData = { alunos: [], turmas: [], cefr: {A1:0,A2:0,B1:0,B2:0,C1:0,C2:0}, financeiro: {entradas:0,saidas:0}, agenda: [] };
    function loadData() {
      const stored = localStorage.getItem('cadernoOnlineData');
      return stored ? JSON.parse(stored) : defaultData;
    }
    function saveData(data) {
      localStorage.setItem('cadernoOnlineData', JSON.stringify(data));
      renderStudents();
      updateCEFRCounts(data.alunos);
    }

    // ====== RENDER ======
    function renderStudents() {
      const data = loadData();
      const search = $('#searchInput').value.toLowerCase().trim();
      const level = $('#levelFilter').value;
      
      let filtered = data.alunos.filter(a => {
        const matchSearch = !search || a.nome.toLowerCase().includes(search) || (a.email || '').toLowerCase().includes(search);
        const matchLevel = !level || a.nivel === level;
        return matchSearch && matchLevel;
      });

      const listEl = $('#studentList');
      const emptyEl = $('#emptyState');
      
      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      
      emptyEl.classList.add('hidden');
      listEl.innerHTML = filtered.map(a => `
        <div class="student-card bg-card rounded-xl border p-4 flex flex-col gap-3">
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-3">
              <div class="h-10 w-10 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold">
                ${a.nome.charAt(0).toUpperCase()}
              </div>
              <div>
                <h4 class="font-semibold">${a.nome}</h4>
                <p class="text-xs text-muted-foreground">${a.nivel || 'Nível não definido'}</p>
              </div>
            </div>
            <div class="flex gap-1">
              <button onclick="editStudent('${a.id}')" class="p-1.5 hover:bg-muted rounded transition" title="Editar">
                <i data-lucide="pencil" class="h-4 w-4"></i>
              </button>
              <button onclick="deleteStudent('${a.id}')" class="p-1.5 hover:bg-red-100 dark:hover:bg-red-900/30 text-red-500 rounded transition" title="Excluir">
                <i data-lucide="trash-2" class="h-4 w-4"></i>
              </button>
            </div>
          </div>
          <div class="text-sm space-y-1 text-muted-foreground pt-2 border-t">
            ${a.email ? `<p><i data-lucide="mail" class="h-3 w-3 inline mr-1"></i> ${a.email}</p>` : ''}
            ${a.telefone ? `<p><i data-lucide="phone" class="h-3 w-3 inline mr-1"></i> ${a.telefone}</p>` : ''}
            <p><i data-lucide="calendar" class="h-3 w-3 inline mr-1"></i> Início: ${formatDate(a.dataInicio)}</p>
            ${a.observacoes ? `<p class="pt-1 text-xs italic">"${a.observacoes}"</p>` : ''}
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    function updateCEFRCounts(alunos) {
      const data = loadData();
      const counts = {A1:0,A2:0,B1:0,B2:0,C1:0,C2:0};
      alunos.forEach(a => { if(a.nivel && counts[a.nivel] !== undefined) counts[a.nivel]++; });
      data.cefr = counts;
      saveData(data);
    }

    // ====== MODAL & FORM ======
    function openModal(id = null) {
      const modal = $('#studentModal');
      modal.classList.add('open');
      $('#modalTitle').textContent = id ? 'Editar Aluno' : 'Novo Aluno';
      $('#studentId').value = id || '';
      $('#studentForm').reset();
      
      if (id) {
        const data = loadData();
        const student = data.alunos.find(a => a.id === id);
        if (student) {
          $('#nome').value = student.nome;
          $('#email').value = student.email || '';
          $('#telefone').value = student.telefone || '';
          $('#nivel').value = student.nivel || '';
          $('#dataInicio').value = student.dataInicio || '';
          $('#observacoes').value = student.observacoes || '';
        }
      }
    }

    function closeModal() {
      $('#studentModal').classList.remove('open');
    }

    $('#studentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      const id = $('#studentId').value;
      const studentData = {
        id: id || generateId(),
        nome: $('#nome').value.trim(),
        email: $('#email').value.trim(),
        telefone: $('#telefone').value.trim(),
        nivel: $('#nivel').value,
        dataInicio: $('#dataInicio').value,
        observacoes: $('#observacoes').value.trim(),
        atualizadoEm: new Date().toISOString()
      };

      if (id) {
        const index = data.alunos.findIndex(a => a.id === id);
        if (index !== -1) {
          data.alunos[index] = { ...data.alunos[index], ...studentData };
        }
      } else {
        studentData.criadoEm = new Date().toISOString();
        data.alunos.push(studentData);
      }

      saveData(data);
      closeModal();
    });

    function editStudent(id) { openModal(id); }
    
    function deleteStudent(id) {
      if (!confirm('Tem certeza que deseja excluir este aluno? Esta ação não pode ser desfeita.')) return;
      const data = loadData();
      data.alunos = data.alunos.filter(a => a.id !== id);
      saveData(data);
    }

    // ====== EVENT LISTENERS ======
    $('#searchInput').addEventListener('input', renderStudents);
    $('#levelFilter').addEventListener('change', renderStudents);
    $('#themeToggle').addEventListener('click', () => lucide.createIcons());
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });
    $('#studentModal').addEventListener('click', (e) => { if(e.target === $('#studentModal')) closeModal(); });

    // ====== INIT ======
    document.addEventListener('DOMContentLoaded', () => {
      $('#year').textContent = new Date().getFullYear();
      lucide.createIcons();
      renderStudents();
    });
  </script>
</body>
</html>
