<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aulas CEFR — Caderno Online</title>
  <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --bg: 0 0% 100%; --fg: 222.2 84% 4.9%; }
    .dark { --bg: 222.2 84% 4.9%; --fg: 210 40% 98%; }
    body { background: hsl(var(--bg)); color: hsl(var(--fg)); font-family: system-ui, sans-serif; }
    .modal { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.open { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body class="min-h-screen transition-colors duration-300">
  <header class="sticky top-0 z-50 border-b bg-white/80 dark:bg-gray-900/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center"><i data-lucide="book-open" class="h-5 w-5 text-white"></i></div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Caderno Online</h1>
      </a>
      <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition"><i data-lucide="sun" class="hidden dark:block h-5 w-5"></i><i data-lucide="moon" class="block dark:hidden h-5 w-5"></i></button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <div><h2 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="book-marked" class="h-6 w-6 text-green-500"></i> Aulas CEFR</h2><p class="text-sm text-gray-500 mt-1">Lessons organizadas por nível A1-C2</p></div>
      <button onclick="openModal()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition flex items-center gap-2"><i data-lucide="plus" class="h-4 w-4"></i> Nova Aula</button>
    </div>
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="empty" class="hidden flex-col items-center justify-center py-16 text-center"><div class="h-16 w-16 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center mb-4"><i data-lucide="book-plus" class="h-8 w-8 text-gray-400"></i></div><h3 class="text-lg font-semibold mb-2">Nenhuma aula encontrada</h3><p class="text-gray-500 max-w-sm">Crie sua primeira lesson CEFR.</p></div>
  </main>

  <footer class="mt-auto border-t py-4 text-center text-xs text-gray-500">© <span id="year"></span> Caderno Online</footer>

  <!-- MODAL -->
  <div id="modal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white dark:bg-gray-800 rounded-xl border w-full max-w-lg p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4"><h3 id="m-title" class="text-lg font-semibold">Nova Aula</h3><button onclick="closeModal()" class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full"><i data-lucide="x" class="h-5 w-5"></i></button></div>
      <form id="form" class="space-y-4">
        <input type="hidden" id="id">
        <div><label class="block text-sm font-medium mb-1">Título *</label><input type="text" id="titulo" required class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500/50"></div>
        <div><label class="block text-sm font-medium mb-1">Descrição</label><textarea id="descricao" rows="2" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500/50"></textarea></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-medium mb-1">Nível</label><select id="nivel" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600"><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option></select></div>
          <div><label class="block text-sm font-medium mb-1">Turma (opcional)</label><select id="turma" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600"><option value="">Nenhuma</option></select></div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Links & Recursos</label>
          <div id="links-box" class="space-y-2 mb-2"></div>
          <button type="button" onclick="addLink()" class="text-sm text-green-600 hover:text-green-700 flex items-center gap-1"><i data-lucide="plus-circle" class="w-4 h-4"></i> Adicionar Link</button>
        </div>
        <div><label class="block text-sm font-medium mb-1">Conteúdo</label><textarea id="conteudo" rows="3" class="w-full px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500/50"></textarea></div>
        <div class="flex gap-3 pt-2"><button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">Cancelar</button><button type="submit" class="flex-1 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition">Salvar</button></div>
      </form>
    </div>
  </div>

  <script>
    // DB & UI
    const html = document.documentElement;
    if(localStorage.getItem('theme')==='dark') html.classList.add('dark');
    document.getElementById('themeToggle').onclick = () => { html.classList.toggle('dark'); localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light'); };
    document.getElementById('year').textContent = new Date().getFullYear();

    function loadDB() { const s = localStorage.getItem('cadernoOnlineDB'); return s ? JSON.parse(s) : {alunos:[],turmas:[],cefr:[],material:[],agenda:[],financeiro:{transacoes:[]}}; }
    function saveDB(db) { localStorage.setItem('cadernoOnlineDB', JSON.stringify(db)); render(); }

    function render() {
      const db = loadDB();
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      if(db.cefr.length===0) { list.innerHTML=''; empty.classList.remove('hidden'); empty.classList.add('flex'); return; }
      empty.classList.add('hidden'); empty.classList.remove('flex');
      
      list.innerHTML = db.cefr.map((c,i) => {
        let linksHtml = '';
        if(c.links?.length) {
          linksHtml = '<div class="mt-3 pt-3 border-t flex flex-wrap gap-2">' + c.links.map(l => {
            const icon = l.tipo==='video' ? 'youtube' : l.tipo==='pdf' ? 'file-text' : 'link';
            const color = l.tipo==='video' ? 'text-red-600 bg-red-50 dark:bg-red-900/20 dark:text-red-400' : l.tipo==='pdf' ? 'text-orange-600 bg-orange-50 dark:bg-orange-900/20 dark:text-orange-400' : 'text-blue-600 bg-blue-50 dark:bg-blue-900/20 dark:text-blue-400';
            return `<a href="${l.url}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium ${color} hover:opacity-80"><i data-lucide="${icon}" class="w-3 h-3"></i> ${l.label}</a>`;
          }).join('') + '</div>';
        }
        return `<div class="bg-white dark:bg-gray-800 p-4 rounded-xl border shadow-sm hover:shadow-md transition relative group">
          <div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition flex gap-1">
            <button onclick="edit(${i})" class="p-1.5 bg-gray-100 dark:bg-gray-700 rounded hover:bg-blue-100 dark:hover:bg-blue-900/30 text-blue-600"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
            <button onclick="del(${i})" class="p-1.5 bg-gray-100 dark:bg-gray-700 rounded hover:bg-red-100 dark:hover:bg-red-900/30 text-red-600"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
          </div>
          <h4 class="font-semibold text-lg">${c.titulo}</h4>
          <span class="text-xs px-2 py-0.5 rounded bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 font-medium">${c.nivel}</span>
          ${c.descricao ? `<p class="text-sm text-gray-500 mt-2 line-clamp-2">${c.descricao}</p>` : ''}
          ${linksHtml}
          ${c.conteudo ? `<div class="mt-3 p-3 bg-gray-50 dark:bg-gray-700 rounded text-sm whitespace-pre-line max-h-24 overflow-y-auto">${c.conteudo}</div>` : ''}
        </div>`;
      }).join('');
      lucide.createIcons();
    }

    // Modal & Form
    function openModal(id=null) {
      document.getElementById('modal').classList.add('open');
      document.getElementById('m-title').textContent = id ? 'Editar Aula' : 'Nova Aula';
      document.getElementById('form').reset();
      document.getElementById('id').value = id ?? '';
      document.getElementById('links-box').innerHTML = '';
      addLink();
      // Populate turma select
      const db = loadDB();
      const sel = document.getElementById('turma');
      sel.innerHTML = '<option value="">Nenhuma</option>' + db.turmas.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
      if(id!==null) {
        const c = db.cefr[id];
        document.getElementById('titulo').value = c.titulo;
        document.getElementById('descricao').value = c.descricao||'';
        document.getElementById('nivel').value = c.nivel;
        document.getElementById('turma').value = c.turmaId||'';
        document.getElementById('conteudo').value = c.conteudo||'';
        document.getElementById('links-box').innerHTML = '';
        (c.links||[]).forEach(l => addLink(l.url, l.label, l.tipo));
      }
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    function addLink(url='',label='',tipo='link') {
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center';
      div.innerHTML = `
        <select class="link-tipo border rounded p-1.5 text-sm w-24 bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
          <option value="link" ${tipo==='link'?'selected':''}>Link</option>
          <option value="video" ${tipo==='video'?'selected':''}>Vídeo</option>
          <option value="pdf" ${tipo==='pdf'?'selected':''}>PDF</option>
        </select>
        <input type="text" placeholder="URL" class="link-url flex-1 px-3 py-1.5 rounded border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 text-sm" value="${url}">
        <input type="text" placeholder="Rótulo" class="link-label w-24 px-3 py-1.5 rounded border bg-gray-50 dark:bg-gray-700 dark:border-gray-600 text-sm" value="${label}">
        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 p-1 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>`;
      document.getElementById('links-box').appendChild(div);
      lucide.createIcons();
    }
    function getLinks() {
      return Array.from(document.getElementById('links-box').children).map(row => ({
        tipo: row.querySelector('.link-tipo').value,
        url: row.querySelector('.link-url').value.trim(),
        label: row.querySelector('.link-label').value.trim() || 'Acessar'
      })).filter(l => l.url);
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const db = loadDB();
      const id = document.getElementById('id').value;
      const data = {
        id: id || crypto.randomUUID(),
        titulo: document.getElementById('titulo').value.trim(),
        descricao: document.getElementById('descricao').value.trim(),
        nivel: document.getElementById('nivel').value,
        turmaId: document.getElementById('turma').value || null,
        conteudo: document.getElementById('conteudo').value.trim(),
        links: getLinks()
      };
      if(id) { const i = db.cefr.findIndex(c=>c.id===id); if(i!==-1) db.cefr[i] = data; }
      else db.cefr.push(data);
      saveDB(db);
      closeModal();
    });

    function edit(i) { openModal(i); }
    function del(i) { if(confirm('Excluir esta aula?')) { const db=loadDB(); db.cefr.splice(i,1); saveDB(db); } }
    document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
    document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

    render();
  </script>
</body>
</html>
