<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aulas CEFR - Caderno Online</title>
    <link rel="icon" href="image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Estilos base para o tema */
        body { font-family: system-ui, sans-serif; background-color: #f3f4f6; }
        .modal { background-color: rgba(0,0,0,0.5); }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Navegação Superior -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-gradient-to-br from-purple-600 to-pink-600 p-2 rounded-lg">
                        <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                        Caderno Online
                    </h1>
                </div>
                <div class="flex gap-2">
                    <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="home" class="w-4 h-4"></i> Home</a>
                    <a href="alunos.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> Alunos</a>
                    <a href="turmas.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="graduation-cap" class="w-4 h-4"></i> Turmas</a>
                    <a href="cefr.html" class="px-4 py-2 rounded-lg bg-purple-50 text-purple-600 font-medium flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> CEFR</a>
                    <a href="financeiro.html" class="px-4 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2"><i data-lucide="wallet" class="w-4 h-4"></i> Financeiro</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Cabeçalho da Página -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="file-text" class="text-purple-600"></i> Aulas e Conteúdos
                </h2>
                <p class="text-gray-500 text-sm">Gerencie suas aulas organizadas pelos níveis CEFR (A1-C2)</p>
            </div>
            <button onclick="openModal()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 flex items-center gap-2 shadow-sm transition">
                <i data-lucide="plus" class="w-4 h-4"></i> Nova Aula
            </button>
        </div>

        <!-- Filtros -->
        <div class="bg-white p-4 rounded-xl border mb-6 flex flex-col sm:flex-row gap-4 items-center shadow-sm">
            <div class="relative flex-1 w-full">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar por título..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            </div>
            <select id="levelFilter" class="w-full sm:w-40 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                <option value="">Todos os Níveis</option>
                <option value="A1">A1 - Iniciante</option>
                <option value="A2">A2 - Básico</option>
                <option value="B1">B1 - Intermediário</option>
                <option value="B2">B2 - Intermediário Alto</option>
                <option value="C1">C1 - Avançado</option>
                <option value="C2">C2 - Proficiente</option>
            </select>
        </div>

        <!-- Lista de Aulas (Grid) -->
        <div id="lessonsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Os cards serão injetados aqui pelo JavaScript -->
        </div>

        <!-- Estado Vazio -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="bg-gray-100 p-4 rounded-full mb-4">
                <i data-lucide="book-plus" class="w-8 h-8 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-700">Nenhuma aula encontrada</h3>
            <p class="text-gray-500 max-w-sm mt-2">Comece cadastrando sua primeira aula ou conteúdo clicando no botão acima.</p>
        </div>

    </main>

    <!-- Modal de Cadastro/Edição -->
    <div id="lessonModal" class="modal fixed inset-0 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all scale-100">
            
            <!-- Cabeçalho do Modal -->
            <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">Nova Aula</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Formulário -->
            <form id="lessonForm" class="p-6 space-y-4">
                <input type="hidden" id="editId">

                <!-- Título -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Título da Aula *</label>
                    <input type="text" id="titulo" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Ex: Present Simple vs Continuous">
                </div>

                <!-- Nível e Turma (Opcional) -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nível CEFR *</label>
                        <select id="nivel" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="A1">A1</option>
                            <option value="A2">A2</option>
                            <option value="B1">B1</option>
                            <option value="B2">B2</option>
                            <option value="C1">C1</option>
                            <option value="C2">C2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Turma (Opcional)</label>
                        <select id="turmaId" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">Nenhuma</option>
                            <!-- Opções injetadas via JS -->
                        </select>
                    </div>
                </div>

                <!-- Descrição -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                    <textarea id="descricao" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" placeholder="Resumo do conteúdo da aula..."></textarea>
                </div>

                <!-- Links / Recursos -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Links e Materiais</label>
                    <div id="linksContainer" class="space-y-2 mb-2">
                        <!-- Inputs de link dinâmicos -->
                    </div>
                    <button type="button" onclick="addLinkInput()" class="text-sm text-purple-600 hover:text-purple-800 flex items-center gap-1 font-medium">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Adicionar Link
                    </button>
                </div>

                <!-- Ações -->
                <div class="flex gap-3 pt-4 border-t mt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium">Cancelar</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium shadow-sm">Salvar Aula</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        // --- Banco de Dados Local ---
        const DB_KEY = 'cadernoOnlineDB';
        
        function getDB() {
            const data = localStorage.getItem(DB_KEY);
            return data ? JSON.parse(data) : { alunos: [], turmas: [], cefr: [], financeiro: { entradas: 0, saidas: 0 } };
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // --- Inicialização ---
        document.addEventListener('DOMContentLoaded', () => {
            renderLessons();
            populateTurmaSelect();
            lucide.createIcons();
        });

        // --- Renderização ---
        function renderLessons() {
            const db = getDB();
            const listEl = document.getElementById('lessonsList');
            const emptyEl = document.getElementById('emptyState');
            
            // Filtros
            const search = document.getElementById('searchInput').value.toLowerCase();
            const level = document.getElementById('levelFilter').value;

            let filtered = db.cefr.filter(a => {
                const matchSearch = a.titulo.toLowerCase().includes(search);
                const matchLevel = level ? a.nivel === level : true;
                return matchSearch && matchLevel;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                emptyEl.classList.add('flex');
                return;
            }

            emptyEl.classList.add('hidden');
            emptyEl.classList.remove('flex');

            // Cores dos Níveis
            const levelColors = {
                A1: 'bg-green-100 text-green-700',
                A2: 'bg-blue-100 text-blue-700',
                B1: 'bg-yellow-100 text-yellow-700',
                B2: 'bg-orange-100 text-orange-700',
                C1: 'bg-red-100 text-red-700',
                C2: 'bg-purple-100 text-purple-700'
            };

            listEl.innerHTML = filtered.map((aula, index) => {
                // Encontrar o índice real no array original para edição/exclusão
                const originalIndex = db.cefr.indexOf(aula);
                
                let linksHtml = '';
                if (aula.links && aula.links.length > 0) {
                    linksHtml = `<div class="mt-4 pt-3 border-t border-gray-100 flex flex-wrap gap-2">
                        ${aula.links.map(link => `
                            <a href="${link.url}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 rounded text-xs font-medium bg-gray-100 text-gray-600 hover:bg-purple-50 hover:text-purple-600 transition">
                                <i data-lucide="${link.url.includes('youtube') ? 'youtube' : 'link'}" class="w-3 h-3"></i> ${link.label}
                            </a>
                        `).join('')}
                    </div>`;
                }

                return `
                <div class="bg-white p-5 rounded-xl border shadow-sm card-hover transition relative group">
                    <!-- Botões de Ação (visíveis no hover) -->
                    <div class="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editLesson(${originalIndex})" class="p-1.5 bg-gray-100 rounded hover:bg-blue-100 text-gray-500 hover:text-blue-600 transition" title="Editar">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteLesson(${originalIndex})" class="p-1.5 bg-gray-100 rounded hover:bg-red-100 text-gray-500 hover:text-red-600 transition" title="Excluir">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="flex items-start justify-between mb-2">
                        <span class="px-2 py-1 rounded-md text-xs font-bold ${levelColors[aula.nivel] || 'bg-gray-100 text-gray-600'}">${aula.nivel}</span>
                    </div>
                    
                    <h3 class="text-lg font-bold text-gray-800 mb-1">${aula.titulo}</h3>
                    <p class="text-sm text-gray-500 line-clamp-2">${aula.descricao || 'Sem descrição'}</p>
                    
                    ${linksHtml}
                </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        // --- Popula Select de Turmas ---
        function populateTurmaSelect() {
            const db = getDB();
            const select = document.getElementById('turmaId');
            select.innerHTML = '<option value="">Nenhuma</option>';
            db.turmas.forEach(t => {
                const option = document.createElement('option');
                option.value = t.id; // Usa ID se existir, senão usa nome
                option.textContent = t.nome;
                select.appendChild(option);
            });
        }

        // --- Modal e Formulário ---
        function openModal() {
            document.getElementById('lessonModal').classList.remove('hidden');
            document.getElementById('lessonModal').classList.add('flex');
            document.getElementById('modalTitle').textContent = 'Nova Aula';
            document.getElementById('lessonForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('linksContainer').innerHTML = '';
            addLinkInput(); // Adiciona um campo vazio
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('lessonModal').classList.add('hidden');
            document.getElementById('lessonModal').classList.remove('flex');
        }

        function addLinkInput(url = '', label = '') {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <input type="text" placeholder="URL (https://...)" value="${url}" class="link-url flex-1 px-3 py-1.5 border rounded text-sm focus:outline-none focus:ring-1 focus:ring-purple-500">
                <input type="text" placeholder="Nome" value="${label}" class="link-label w-24 px-3 py-1.5 border rounded text-sm focus:outline-none focus:ring-1 focus:ring-purple-500">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 p-1"><i data-lucide="x" class="w-4 h-4"></i></button>
            `;
            document.getElementById('linksContainer').appendChild(div);
            lucide.createIcons();
        }

        function getLinksFromForm() {
            const links = [];
            const inputs = document.getElementById('linksContainer').children;
            for (let row of inputs) {
                const url = row.querySelector('.link-url').value.trim();
                const label = row.querySelector('.link-label').value.trim();
                if (url) {
                    links.push({ url, label: label || 'Link' });
                }
            }
            return links;
        }

        document.getElementById('lessonForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const db = getDB();
            const editId = document.getElementById('editId').value;

            const aulaData = {
                titulo: document.getElementById('titulo').value.trim(),
                nivel: document.getElementById('nivel').value,
                descricao: document.getElementById('descricao').value.trim(),
                turmaId: document.getElementById('turmaId').value,
                links: getLinksFromForm()
            };

            if (editId !== '') {
                // Editando
                db.cefr[parseInt(editId)] = aulaData;
            } else {
                // Criando
                db.cefr.push(aulaData);
            }

            saveDB(db);
            renderLessons();
            closeModal();
        });

        // --- Ações ---
        function editLesson(index) {
            const db = getDB();
            const aula = db.cefr[index];
            
            openModal();
            document.getElementById('modalTitle').textContent = 'Editar Aula';
            document.getElementById('editId').value = index;
            document.getElementById('titulo').value = aula.titulo;
            document.getElementById('nivel').value = aula.nivel;
            document.getElementById('descricao').value = aula.descricao || '';
            
            // Preencher links
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            if (aula.links && aula.links.length > 0) {
                aula.links.forEach(l => addLinkInput(l.url, l.label));
            } else {
                addLinkInput();
            }
        }

        function deleteLesson(index) {
            if (confirm('Tem certeza que deseja excluir esta aula?')) {
                const db = getDB();
                db.cefr.splice(index, 1);
                saveDB(db);
                renderLessons();
            }
        }

        // Listeners de Filtro
        document.getElementById('searchInput').addEventListener('input', renderLessons);
        document.getElementById('levelFilter').addEventListener('change', renderLessons);

    </script>
</body>
</html>
